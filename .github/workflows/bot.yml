name: Bot

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:
    inputs:
      force_video:
        description: "Render a video even if today's video limit was reached"
        type: boolean
        default: false
      preview:
        description: "Dry run that only makes the video and pushes it to the previews branch"
        type: boolean
        default: false

concurrency:
  group: bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: denoland/setup-deno@v2   # JavaScript runtime yt-dlp needs for YouTube
        with:
          deno-version: v2.x
      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
          BOT_HANDLE: ${{ vars.BOT_HANDLE }}
          BOT_LANGUAGE: ${{ vars.BOT_LANGUAGE }}
          YOUTUBE_CHANNELS: ${{ vars.YOUTUBE_CHANNELS }}
          CC_QUERIES: ${{ vars.CC_QUERIES }}
          TIKTOK_PRIVACY: ${{ vars.TIKTOK_PRIVACY }}
          MAX_VIDEOS_PER_DAY: ${{ vars.MAX_VIDEOS_PER_DAY }}
          MAX_POSTS_PER_DAY: ${{ vars.MAX_POSTS_PER_DAY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: python -m gtabot ${{ inputs.force_video && '--force-video' || '' }} ${{ inputs.preview && '--dry-run --force-video --video-only' || '' }}

      - name: Keep what was published
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ github.run_id }}
          path: output/
          retention-days: 14
          if-no-files-found: ignore

      - name: Publish preview to the previews branch
        if: inputs.preview
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/preview && cp output/*/video.mp4 output/*/video.json /tmp/preview/
          cd /tmp/preview
          git init -q -b previews
          git add . && git -c user.name=gta6-bot -c user.email=gta6-bot@users.noreply.github.com commit -qm "preview ${{ github.run_id }}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" previews

      - name: Save state
        if: always() && !inputs.preview
        run: |
          git config user.name "gta6-bot"
          git config user.email "gta6-bot@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "bot: update state [skip ci]"
          git push
